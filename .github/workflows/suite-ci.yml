name: Draw frontend verification

on:
  schedule:
    - cron: "17 22 * * *"
  pull_request:
    paths:
      - "suite/**"
      - "frontend/**"
      - "realtime/**"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/suite-ci.yml"
  workflow_dispatch:
    inputs:
      run_recorder_integration:
        description: Run the recorder integration scenarios
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    timeout-minutes: 15

    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check frontend changes
        id: frontend-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_frontend=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|package\.json|yarn\.lock|\.github/workflows/suite-ci\.yml)' && run_frontend=1 || run_frontend=0
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            fi
            printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|package\.json|yarn\.lock|\.github/workflows/suite-ci\.yml)' && run_frontend=1 || run_frontend=0
          fi

          echo "run=$run_frontend" >> $GITHUB_OUTPUT
          echo "Run frontend: $run_frontend"

      - name: Setup Node
        if: steps.frontend-changes.outputs.run == '1'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.frontend-changes.outputs.run == '1'
        run: yarn install --frozen-lockfile

      - name: Check frontend formatting
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn format:check

      - name: Lint frontend
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn lint

      - name: Check untranslated text
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn check:untranslated

      - name: Check generated contract types
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn check:contract

      - name: Create bench site config
        if: steps.frontend-changes.outputs.run == '1'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../sites"
          printf '{"default_site":"suite-preview.localhost","webserver_port":8005,"socketio_port":9003}\n' > "$GITHUB_WORKSPACE/../../sites/common_site_config.json"

      - name: Check frontend import boundaries
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn check:import-boundaries

      - name: Typecheck frontend
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn typecheck

      - name: Check frontend bundle budget
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: yarn check:bundle-budget

      - name: Build
        if: steps.frontend-changes.outputs.run == '1'
        run: yarn build

      - name: Test
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: |
          mkdir -p test-results
          yarn test:unified
          yarn test:legacy

      - name: Upload Frontend Evidence
        if: always() && steps.frontend-changes.outputs.run == '1'
        uses: actions/upload-artifact@v7
        with:
          name: suite-frontend-evidence
          path: |
            frontend/test-results/
            suite/public/frontend/
            suite/www/suite.html
            suite/www/service-worker.js
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Frontend Coverage
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule') && steps.frontend-changes.outputs.run == '1'
        uses: actions/upload-artifact@v7
        with:
          name: suite-frontend-coverage
          path: frontend/test-results/coverage/cobertura-coverage.xml
          if-no-files-found: warn
          retention-days: 7
